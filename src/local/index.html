<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketPilot · 串接預覽</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;background:#f2f5f8;color:#203040;margin:0}main{max-width:920px;margin:48px auto;padding:0 24px}h1{margin-bottom:4px}.muted{color:#586b7c}.card{background:white;border:1px solid #dbe3eb;border-radius:12px;padding:24px;margin:20px 0}button,select{font:inherit;padding:10px 16px;margin:6px 8px 6px 0;border:1px solid #afc0cf;border-radius:6px}button{cursor:pointer;background:#143f6a;color:white}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;background:#122333;color:#dceaf5;padding:20px;min-height:180px;border-radius:8px}#message{color:#8c3c15}
</style></head><body><main>
<h1>TicketPilot</h1><div class="muted">第 1–3 階段 · 本機設定與執行串接預覽</div>
<div class="card"><strong>此頁只執行模擬，不會登入 Klook、取得座位或建立訂單。</strong><p>完整的購票與個資表單將在下一階段加入。目前可建立獨立示範活動，驗證保存、載入及子程序狀態。</p>
<button id="create">新增示範活動</button><select id="activities" aria-label="已儲存活動"></select><button id="start">開始模擬</button><p class="muted">使用虛構聯絡資料進行格式驗證，不讀取或修改 contact.local.json。</p><div id="message" role="alert"></div></div>
<div class="card"><strong id="status">尚未執行</strong><p id="target"></p><pre id="logs" aria-label="執行紀錄">等待模擬執行。</pre></div>
</main><script>
const token = "__TOKEN__";
const activities = document.querySelector('#activities'), status = document.querySelector('#status'), logs = document.querySelector('#logs'), start = document.querySelector('#start'), message = document.querySelector('#message');
let pendingRequest = null;
let running = false;
let requesting = false;
async function api(path, method='GET', value) {
    const response = await fetch(path, {method,headers:{'X-Local-Token':token,'Content-Type':'application/json'},body:value===undefined?undefined:JSON.stringify(value)});
    const data = await response.json(); if (!response.ok) throw Error(data.error); return data;
}
async function list() {
    const data=await api('/api/activities'); activities.replaceChildren();
    for(const activity of data.activities){const option=document.createElement('option');option.value=activity.id;option.textContent=activity.settings.eventName;activities.append(option)}
    if(data.invalidFiles) message.textContent=`有 ${data.invalidFiles} 個活動檔無法載入，未自動覆寫。`;
}
document.querySelector('#create').onclick=async()=>{try{
    const record=await api('/api/activities','POST',{eventUrl:'https://www.klook.com/zh-TW/event-detail/local-demo/',eventName:'串接示範活動（非真實購票設定）',fallbackMode:'STRICT',excludeKeywords:['愛心席','身障','視線不良'],targets:[{date:'2026-11-02',time:'19:30',area:'B區',unitPrice:5280,quantity:1,adjacent:false}]});
    await list();activities.value=record.id;message.textContent='示範活動已儲存。';
}catch(error){message.textContent=error.message}};
start.onclick=async()=>{requesting=true;start.disabled=true;try{
    if(!activities.value) throw Error('請先建立或選擇活動。');
    pendingRequest ??= {requestId:crypto.randomUUID(),activityId:activities.value,contact:{firstName:'Demo',lastName:'Fixture',regionLabel:'台灣 (+886)',phone:'0912345678',email:'demo@example.com'}};
    render(await api('/api/simulation','POST',pendingRequest));pendingRequest=null;message.textContent='';
}catch(error){message.textContent=error.message+'；重新按下會沿用同一次請求。'}finally{requesting=false;start.disabled=running}};
function render(run){
    if(!run)return;
    running=run.status==='running';
    start.disabled=requesting||running;
    status.textContent=run.status==='running'?'模擬執行中':run.status==='completed'?'模擬完成（未購票）':'模擬中斷，沒有自動重跑';
    document.querySelector('#target').textContent='執行識別碼：'+run.id;
    logs.textContent=(run.historyTruncated?'較早紀錄已省略。\n':'')+run.events.filter(item=>item.event.type==='log').map(item=>new Date(item.at).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'})+'  '+(item.event.type==='state'?item.event.state:item.event.message)).join('\n');
}
const stream=new EventSource('/api/events?token='+encodeURIComponent(token));stream.onmessage=event=>render(JSON.parse(event.data));stream.onerror=()=>{message.textContent='狀態連線中斷，正在重新連線；不會因此重新啟動模擬。'};stream.onopen=()=>{message.textContent=''};
list().catch(error=>message.textContent=error.message);
</script></body></html>
